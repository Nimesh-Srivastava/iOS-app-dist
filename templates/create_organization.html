{% extends 'base.html' %}
{% block title %}Create Organization{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">
          <i class="fas fa-building me-2"></i>Create New Organization
        </h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Organization Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="name" name="name" required>
            <small class="form-text text-muted">A unique name for this organization</small>
          </div>
          
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            <small class="form-text text-muted">Optional description of the organization</small>
          </div>
          
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('org.list_organizations') }}" class="btn btn-secondary">
              <i class="fas fa-arrow-left me-1"></i>Cancel
            </a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save me-1"></i>Create Organization
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
